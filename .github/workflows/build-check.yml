name: Build Verification

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24.x'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Build project
      run: npm run build
      env:
        NEXT_PUBLIC_FIREBASE_API_KEY: ci-build-placeholder
        NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ci-build-placeholder.firebaseapp.com
        NEXT_PUBLIC_FIREBASE_PROJECT_ID: ci-build-placeholder
        STRIPE_SECRET_KEY: sk_test_ci_build_placeholder
