name = "espeezy-articles"
main = ".open-next/worker.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[assets]
binding = "ASSETS"
directory = ".open-next/assets"

[[routes]]
pattern = "articles.espeezy.com/*"
zone_name = "espeezy.com"
custom_domain = true

[[routes]]
pattern = "blog.espeezy.com/*"
zone_name = "espeezy.com"
custom_domain = true
