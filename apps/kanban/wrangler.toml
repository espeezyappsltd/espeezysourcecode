name = "espeezy-kanban"
main = ".open-next/worker.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[assets]
binding = "ASSETS"
directory = ".open-next/assets"

[[routes]]
pattern = "kanban.espeezy.com/*"
zone_name = "espeezy.com"
custom_domain = true

# Cron: Cloudflare dashboard → Workers → Triggers → call GET /api/cron/expire-verifications with CRON_SECRET
