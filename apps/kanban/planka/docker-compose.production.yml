services:
  planka:
    image: ghcr.io/plankanban/planka:latest
    container_name: espeezy_planka
    restart: unless-stopped
    ports:
      - "${PLANKA_PORT:-3333}:1337"
    environment:
      BASE_URL: ${BASE_URL}
      DATABASE_URL: ${SUPABASE_DB_URL}
      SECRET_KEY: ${SECRET_KEY}
      TRUST_PROXY: "true"
      DEFAULT_ADMIN_NAME: ${DEFAULT_ADMIN_NAME:-Espeezy Admin}
      DEFAULT_ADMIN_USERNAME: ${DEFAULT_ADMIN_USERNAME:-admin}
      DEFAULT_ADMIN_EMAIL: ${DEFAULT_ADMIN_EMAIL}
      DEFAULT_ADMIN_PASSWORD: ${DEFAULT_ADMIN_PASSWORD}
      DEFAULT_PROJECT_NAME: ${DEFAULT_PROJECT_NAME:-Espeezy Workspace}
      DEFAULT_BOARD_NAME: ${DEFAULT_BOARD_NAME:-Kanban Board}
      OUTGOING_BLOCKED_IPS: ${OUTGOING_BLOCKED_IPS:-127.0.0.1,0.0.0.0}
      OUTGOING_BLOCKED_HOSTS: ${OUTGOING_BLOCKED_HOSTS:-localhost}
    volumes:
      - planka_user_avatars:/app/public/user-avatars
      - planka_project_background_images:/app/public/project-background-images
      - planka_attachments:/app/private/attachments

volumes:
  planka_user_avatars:
  planka_project_background_images:
  planka_attachments:
